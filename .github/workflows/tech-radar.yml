name: Tech Radar
on:
  schedule:
    - cron: "7 3 * * *"     # 06:07 Nairobi
    - cron: "23 7 * * *"    # 10:23 Nairobi
    - cron: "17 18 * * *"   # 21:17 Nairobi
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tech-radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Persist data
        run: |
          git config user.name "tech-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "chore: update data" && git pull --rebase && git push)